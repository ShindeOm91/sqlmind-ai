spring.application.name=sqlmind-api
spring.datasource.url=jdbc:postgresql://localhost:5432/sqlmind_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# JWT Configuration
jwt.secret=sqlmind-ai-secret-key-for-development-only-please-change-this-to-a-long-random-secret
jwt.expiration=3600000